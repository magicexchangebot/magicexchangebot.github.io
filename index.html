<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Калькулятор Magic Exchange</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow phone column (Telegram mini-app), form card → result → contact → owner check panel */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --sunk:#E8EEE7; --line:#D5DED4;
  --fg:#13201A; --muted:#5A6B61; --accent:#1C7F47; --accent-fg:#FFFFFF; --soft:#DDF0E4;
  --warn:#9A5B00; --warn-bg:#FFF2DA;
  --display:"Unbounded", "Onest", system-ui, sans-serif;
  --body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#17201B; --sunk:#111A15; --line:#2A3830;
  --fg:#E5EEE8; --muted:#93A69A; --accent:#46C07B; --accent-fg:#06140C; --soft:#1C3527;
  --warn:#F3B95C; --warn-bg:#352812; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#17201B; --sunk:#111A15; --line:#2A3830;
  --fg:#E5EEE8; --muted:#93A69A; --accent:#46C07B; --accent-fg:#06140C; --soft:#1C3527;
  --warn:#F3B95C; --warn-bg:#352812; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px 12px}
header .sub{grid-column:1/-1}
.logo{width:48px;height:48px;flex:none;border-radius:50%;background:#fff;border:1px solid var(--line);object-fit:cover}
h1{font-family:var(--display);font-weight:700;font-size:23px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:min(15px,calc((100vw - 40px) / 27));margin:0;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .sub b{color:var(--accent);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{font:inherit;font-size:13.5px;font-weight:600;border:0;border-radius:10px;padding:9px 6px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:8px}
input,select{font:inherit;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0}
input{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
select{font-weight:600;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
select:disabled{opacity:.75}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.swap{align-self:center;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:17px;margin:-4px 0}
.result{background:var(--soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.big{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rate{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.hint{font-size:13.5px;color:var(--accent);font-weight:600}
.note{font-size:13.5px;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px}
.cta{display:block;text-align:center;text-decoration:none;background:var(--accent);color:var(--accent-fg);font-weight:700;border-radius:14px;padding:14px}
.mgr{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.contact{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.contact button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:6px 10px;cursor:pointer}
details{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:12px 14px}
summary{cursor:pointer;font-weight:600;font-size:14px}
.check{font-family:var(--mono);font-size:12.5px;line-height:1.6;margin-top:10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font-variant-numeric:tabular-nums}
.check dt{color:var(--muted)} .check dd{margin:0;text-align:right;overflow-wrap:anywhere}
.check .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:6px 0}
.foot{color:var(--muted);font-size:12px;text-align:center}
@media (prefers-reduced-motion:no-preference){.big{transition:opacity .15s}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
</head>

<script>
// ---------- Котировки: бот Magic Exchange, пересчёт раз в час ----------
const QUOTES_URL = "https://script.google.com/macros/s/AKfycbw6wktdcU8S7AwZpuFD2xOtCKekh65C-lFAnK9Y0nbXeadliWYGXd8u30AlQ7sOisdEYA/exec";
// Запасные значения (26.10.2026), если бот недоступен
let THB = { mid: 33.755, fee: 0.0025 };
let BUY = { RUB: 80.5381*1.063, UAH: 47.207, TRY: 53.987, IDR: 18156.6, GEL: 2.818, EUR: 0.89125*1.0025 };
let PAY = { RUB: 80.5381, UAH: 44.83, TRY: 53.987, IDR: 18156.6, GEL: 2.818 };
let QUOTES_TIME = null, QUOTES_LIVE = false;
const MIN_PROFIT = 11;

const CUR = {
  RUB:{name:"Рубль",flag:"🇷🇺",dec:0}, UAH:{name:"Гривна",flag:"🇺🇦",dec:2},
  TRY:{name:"Лира",flag:"🇹🇷",dec:2},  GEL:{name:"Лари",flag:"🇬🇪",dec:2},
  IDR:{name:"Рупия",flag:"🇮🇩",dec:0}, EUR:{name:"Евро",flag:"🇪🇺",dec:2},
  THB:{name:"Бат",flag:"🇹🇭",dec:0},   USDT:{name:"USDT",flag:"💲",dec:2}
};
let FROM_LIST = ["RUB","UAH","TRY","GEL","IDR","EUR","THB","USDT"];
let TO_LIST   = ["THB","RUB","UAH","TRY","GEL","IDR","USDT"]; // евро пока не выплачиваем

// Шаг 1: сколько X стоит 1 USDT (себестоимость покупки USDT)
function buyCost(c){
  if(c==="USDT") return 1;
  if(c==="THB") return THB.mid*(1+THB.fee);
  return BUY[c];
}
// Шаг 2: сколько Y получаю за 1 USDT (до наценки)
function payPrice(c){
  if(c==="USDT") return 1;
  if(c==="THB") return THB.mid*(1-THB.fee);
  return PAY[c];
}
// Ступени: from — порог в валюте получения; mode mult = ×(1−p), div = ÷(1+p)
let THB_GRIDS = {
  RUB:[[10000,.045],[25000,.0375],[50000,.03],[100000,.025]],
  USDT:[[10000,.04],[25000,.035],[50000,.03],[100000,.025]],
  EUR:[[10000,.045],[50000,.0375]], UAH:[[10000,.045],[50000,.0375]], TRY:[[10000,.045],[50000,.0375]],
  def:[[10000,.04],[50000,.035]]
};
function rules(to,from){
  switch(to){
    case "RUB": return {mode:"mult",min:false,t:[[0,.05],[10000,.035],[50000,.03],[100000,.025],[150000,.02]]};
    case "UAH": return {mode:"mult",min:true, t:[[0,.04],[10000,.035],[30000,.03],[100000,.025]]};
    case "TRY": return {mode:"mult",min:true, t:[[5000,.05],[15000,.04],[50000,.035],[100000,.03],[150000,.025]]};
    case "GEL": return {mode:"mult",min:true, t:[[500,.045],[1000,.04],[2500,.035],[5000,.03]]};
    case "IDR": return {mode:"mult",min:true, t:[[6e6,.04],[15e6,.035],[30e6,.03],[60e6,.025]]};
    case "USDT":return {mode:"mult",min:true, t:[[350,.04],[1000,.035],[1500,.03],[3000,.025]]};
    case "THB": return {mode:"div", min:true, t:THB_GRIDS[from]||THB_GRIDS.def};
  }
}
const factor=(mode,p)=> mode==="div" ? 1/(1+p) : 1-p;

// Расчёт: отдаю amount валюты from → сколько to
function calcBase(from,to,amount){
  const U = amount/buyCost(from), price = payPrice(to), r = rules(to,from);
  const t = r.t;
  for(let i=t.length-1;i>=0;i--){
    const [th,p]=t[i];
    let net = U*price*factor(r.mode,p);
    if(net>=th){
      let tier = `${fmtPct(p)} (от ${fmtNum(th,0)} ${to})`, profit = U - net/price;
      if(i===0 && th===0 && r.min && profit<MIN_PROFIT){ // первая ступень без нижней границы (гривна)
        profit = MIN_PROFIT; net=(U-profit)*price; tier = `мин. ${MIN_PROFIT} USDT`;
      }
      if(net<=0) return {U,price,net:0,tooSmall:true};
      return {U,price,net,profit,tier,idx:i,r};
    }
  }
  // Ниже первой ступени: прибыль не меньше 12 USDT
  const p0=t[0][1], profit=Math.max(MIN_PROFIT, U*(1-factor(r.mode,p0)));
  const net=(U-profit)*price;
  if(net<=0) return {U,price,net:0,tooSmall:true};
  return {U,price,net,profit,tier:`мин. ${MIN_PROFIT} USDT (ниже ${fmtNum(t[0][0],0)} ${to})`,idx:-1,r};
}
// Скидка за перевод бат на счёт (по сумме к получению)
const ACC_DISC=[[15000,.005],[50000,.0025],[150000,.0015]];
function discFor(net){let d=0;for(const [th,v] of ACC_DISC) if(net>=th) d=v;return d;}
function calc(from,to,amount,cash){
  const r=calcBase(from,to,amount);
  if(r.tooSmall||to!=="THB") return r;
  if(cash){ // банкоматы выдают от 100 ฿ — округляем вниз до сотни
    const net=Math.floor(r.net/100)*100;
    if(net<100) return {...r,net:0,tooSmall:true};
    return {...r,net,profit:r.U-net/r.price,tier:r.tier+" · округл. до 100 ฿"};
  }
  const d=discFor(r.net); if(!d) return r;
  const net=r.net*(1+d);
  return {...r,net,profit:r.U-net/r.price,disc:d,tier:r.tier+` + скидка за перевод ${fmtPct(d)}`};
}
// Обратный расчёт: хочу получить target → сколько отдать (минимальная сумма)
function calcReverse(from,to,target,cash){
  let lo=0, hi=(target/payPrice(to)+MIN_PROFIT)*buyCost(from)*1.5;
  for(let k=0;k<40 && calc(from,to,hi,cash).net<target;k++) hi*=2;
  for(let k=0;k<70;k++){const mid=(lo+hi)/2; if(calc(from,to,mid,cash).net>=target) hi=mid; else lo=mid;}
  return hi;
}

// ---------- Формат ----------
const fmtNum=(v,d)=>v.toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtPct=p=>(p*100).toLocaleString("ru-RU",{maximumFractionDigits:2})+"%";
const fmtAmt=(v,c)=>fmtNum(v,CUR[c].dec)+" "+c;
function rateDigits(x){return x>=100?0:x>=10?2:x>=1?3:4}
function parse(s){const v=parseFloat(String(s).replace(/\s/g,"").replace(",","."));return isFinite(v)&&v>0?v:0}

// ---------- UI ----------
const $=id=>document.getElementById(id);
const st={mode:"give",cash:false,from:"RUB",to:"THB"};
function opts(sel,list,val){
  sel.innerHTML=list.map(c=>`<option value="${c}">${CUR[c].flag} ${c}</option>`).join("");
  sel.value=list.includes(val)?val:list[0];
}
function sync(){
  if(st.cash){ st.to="THB"; if(st.from==="THB") st.from="RUB"; }
  opts($("from"),FROM_LIST.filter(c=>c!==st.to),st.from); st.from=$("from").value;
  opts($("to"),(st.cash?["THB"]:TO_LIST).filter(c=>c!==st.from),st.to); st.to=$("to").value;
  $("to").disabled=st.cash;
  $("m-give").setAttribute("aria-pressed",st.mode==="give");
  $("m-get").setAttribute("aria-pressed",st.mode==="get");
  $("w-acc").setAttribute("aria-pressed",!st.cash);
  $("w-cash").setAttribute("aria-pressed",st.cash);
  update();
}
function update(){
  const from=st.from,to=st.to;
  let give,res;
  if(st.mode==="give"){ give=parse($("amtFrom").value); res=give?calc(from,to,give,st.cash):null; }
  else { let want=parse($("amtTo").value); if(want&&st.cash&&to==="THB") want=Math.ceil(want/100)*100; st.wantR=want; if(want){give=calcReverse(from,to,want,st.cash); res=calc(from,to,give,st.cash);} }
  $("resLbl").textContent = st.mode==="give" ? "Вы получите" : "Нужно отдать";
  const note=$("note"), hint=$("hint");
  note.hidden=true; hint.hidden=true;
  if(!res||res.tooSmall){
    $("big").textContent="—"; $("rate").textContent= res&&res.tooSmall ? "Сумма слишком мала для обмена" : "Введите сумму";
    if(st.mode==="give") $("amtTo").value=""; else $("amtFrom").value="";
    $("check").innerHTML=""; setCta(null); return;
  }
  const net=res.net;
  if(st.mode==="give"){ $("amtTo").value=fmtNum(net,CUR[to].dec); $("big").textContent=fmtAmt(net,to); }
  else { const g=Math.ceil(give*Math.pow(10,CUR[from].dec))/Math.pow(10,CUR[from].dec); give=g; $("amtFrom").value=fmtNum(g,CUR[from].dec); $("big").textContent=fmtAmt(g,from); }
  // курс: «1 более дорогая = N более дешёвой»
  const valFrom=1/buyCost(from), valTo=1/payPrice(to);
  let rateTxt;
  if(valTo>=valFrom){const x=give/net; rateTxt=`Курс: 1 ${to} = ${fmtNum(x,rateDigits(x))} ${from}`;}
  else {const x=net/give; rateTxt=`Курс: 1 ${from} = ${fmtNum(x,rateDigits(x))} ${to}`;}
  $("rate").textContent=rateTxt;
  // подсказка о следующей ступени
  const t=res.r.t, nx=res.idx+1;
  let next = nx<t.length ? t[nx][0] : Infinity;
  if(to==="THB" && !st.cash && net<15000 && 15000<next) next=15000;
  if(next<Infinity){hint.textContent=`От ${fmtAmt(next,to)} к получению курс выгоднее`; hint.hidden=false;}
  if(from==="THB"){note.textContent="Способ передачи бат обсудим в переписке перед обменом."; note.hidden=false;}
  if(st.cash){
    note.textContent="Наличные выдаём в батах, суммой кратной 100 ฿: банкоматы не выдают мелкие купюры."+(st.mode==="get"?` К выдаче: ${fmtAmt(st.wantR,"THB")}.`:""); note.hidden=false;
    const fallback="Переводом на счёт от 15 000 ฿ — скидка 0,5%";
    if(st.mode==="give"){ const alt=calc(from,to,give,false), diff=alt.net-net;
      hint.textContent = diff>=1 ? `Переводом на счёт получите на ${fmtAmt(diff,to)} больше (скидка ${fmtPct(alt.disc)})` : fallback;
    } else { const g2=calcReverse(from,to,parse($("amtTo").value),false), diff=give-g2;
      hint.textContent = diff>=Math.pow(10,-CUR[from].dec) ? `Переводом на счёт нужно отдать на ${fmtAmt(diff,from)} меньше (скидка ${fmtPct(calc(from,to,g2,false).disc||0)})` : fallback; }
    hint.hidden=false;
  }
  // проверка
  const rows=[
    ["Отдаёт",fmtAmt(give,from)],
    [`Цена 1 USDT в ${from}`,fmtNum(buyCost(from),4)],
    ["USDT (себестоимость)",fmtNum(res.U,2)],
    ["sep"],
    [`Цена 1 USDT в ${to}`,fmtNum(res.price,4)],
    ["Ступень",res.tier],
    ["Получает",fmtAmt(net,to)],
    ["Прибыль, USDT",fmtNum(res.profit,2)]
  ];
  $("check").innerHTML=rows.map(r=>r[0]==="sep"?'<div class="sep"></div>':`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join("");
  setCta({give,from,net,to});
}
let reqText="";
function setCta(d){
  if(!d){reqText="";$("cta").href="https://t.me/goahouserent";return;}
  reqText=`Здравствуйте! Хочу обменять ${fmtAmt(d.give,d.from)} → ${fmtAmt(d.net,d.to)} (${st.cash?"наличные":"перевод на счёт"}). Расчёт из калькулятора Magic Exchange.`;
  $("cta").href="https://t.me/goahouserent?text="+encodeURIComponent(reqText);
  $("mgr").href=$("cta").href;
}
$("m-give").onclick=()=>{st.mode="give";sync()};
$("m-get").onclick=()=>{st.mode="get";if(!$("amtTo").value)$("amtTo").value="30 000";sync()};
$("w-acc").onclick=()=>{st.cash=false;sync()};
$("w-cash").onclick=()=>{st.cash=true;st.to="THB";if(st.from==="THB")st.from="RUB";sync()};
$("from").onchange=e=>{st.from=e.target.value;sync()};
$("to").onchange=e=>{st.to=e.target.value;sync()};
$("swap").onclick=()=>{ if(st.cash) return; const f=st.from,t=st.to;
  if(!TO_LIST.includes(f)) return; st.from=t; st.to=f; sync(); };
$("amtFrom").addEventListener("input",()=>{if(st.mode!=="give"){st.mode="give";sync();}else update();});
$("amtTo").addEventListener("input",()=>{if(st.mode!=="get"){st.mode="get";sync();}else update();});
$("amtFrom").value="100 000";
sync();
function setFoot(){
  const f=$("foot");
  if(QUOTES_LIVE && QUOTES_TIME){
    const t=QUOTES_TIME.toLocaleString("ru-RU",{timeZone:"Asia/Bangkok",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
    f.textContent="Курсы обновлены "+t+" (время Таиланда). Окончательный курс подтвердит менеджер.";
  } else f.textContent="Не удалось загрузить актуальные курсы. Расчёт примерный — точный курс подтвердит менеджер.";
}
function applyQuotes(q){
  if(!q || !q.thb || !q.cur) return false;
  THB={mid:Number(q.thb.mid),fee:Number(q.thb.fee)/100};
  const c=q.cur, buy={}, pay={};
  Object.keys(c).forEach(k=>{ if(c[k] && c[k].buy>0) buy[k]=Number(c[k].buy); });
  if(c.RUB && c.RUB.cbr>0) pay.RUB=Number(c.RUB.cbr);
  if(c.UAH && c.UAH.pay>0) pay.UAH=Number(c.UAH.pay);
  ["TRY","IDR","GEL"].forEach(k=>{ if(buy[k]) pay[k]=buy[k]; });
  BUY=buy; PAY=pay;
  if(q.tiers) Object.keys(q.tiers).forEach(k=>{ if(q.tiers[k] && q.tiers[k].length) THB_GRIDS[k]=q.tiers[k]; });
  FROM_LIST=FROM_LIST.filter(k=>k==="THB"||k==="USDT"||BUY[k]>0);
  TO_LIST=TO_LIST.filter(k=>k==="THB"||k==="USDT"||PAY[k]>0);
  if(!FROM_LIST.includes(st.from)) st.from="THB";
  if(!TO_LIST.includes(st.to)) st.to="THB";
  QUOTES_TIME=q.updated?new Date(q.updated):null; QUOTES_LIVE=true;
  return true;
}
fetch(QUOTES_URL).then(r=>r.json()).then(q=>{ applyQuotes(q); setFoot(); sync(); })
  .catch(()=>{ setFoot(); });
</script>

  var tg = window.Telegram && window.Telegram.WebApp;
  if(!tg || !tg.initData && !tg.platform) return;

  try{ if(tg.colorScheme) document.documentElement.setAttribute('data-theme', tg.colorScheme); }catch(e){}
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href^="https://t.me/"]');
    if(!a || !tg.openTelegramLink) return;
    e.preventDefault(); tg.openTelegramLink(a.href);
