name: bybit-check
on:
  push:
    paths: ['.github/workflows/bybit-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Bybit P2P
        run: |
          B='{"userId":"","tokenId":"USDT","currencyId":"GEL","payment":[],"side":"1","size":"3","page":"1","amount":"","authMaker":false,"canTrade":false}'
          {
            echo "runner: $(curl -s --max-time 10 https://ipinfo.io/country) $(date -u)"
            for u in https://api2.bybit.com/fiat/otc/item/online https://api2.bytick.com/fiat/otc/item/online https://www.bybit.com/x-api/fiat/otc/item/online https://www.bybitglobal.com/x-api/fiat/otc/item/online; do
              r=$(curl -s -o /tmp/o -w '%{http_code} %{time_total}s' --max-time 20 -X POST -H 'content-type: application/json' -H 'User-Agent: Mozilla/5.0' -d "$B" "$u" || echo "ERR")
              echo "$u -> $r $(head -c 160 /tmp/o 2>/dev/null | tr '\n' ' ')"
            done
          } > bybit-check.txt
          cat bybit-check.txt
      - name: Save result
        run: |
          git config user.name magicexchangebot
          git config user.email magicexchangebot@users.noreply.github.com
          git add bybit-check.txt
          git commit -m "bybit-check result" && git push
